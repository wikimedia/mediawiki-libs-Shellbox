pipelines:
  test:
    blubberfile: blubber.yaml
    stages:
      # Builds and runs the test83 and test85 image variants
      - name: test83
      - name: test85
  publish:
    blubberfile: blubber.yaml
    stages:
      ## Begin PHP 8.3 stages
      # Plain Shellbox with just PHP for RPC (PHP 8.3)
      - name: php-rpc83
        build: prod83
        publish:
          image:
            tags: [php-rpc83]
      # Shellbox with media handling packages (PHP 8.3)
      - name: media83
        build: media83
        publish:
          image:
            tags: [media83]
      # Shellbox with Score packages (PHP 8.3)
      - name: score83
        build: score83
        publish:
          image:
            tags: [score83]
      # Shellbox with SyntaxHighlight packages (PHP 8.3)
      - name: syntaxhighlight83
        build: syntaxhighlight83
        publish:
          image:
            tags: [syntaxhighlight83]
      # Shellbox with Timeline packages (PHP 8.3)
      - name: timeline83
        build: timeline83
        publish:
          image:
            tags: [timeline83]
      # Shellbox with audio+video handling packages (PHP 8.3)
      - name: video83
        build: video83
        publish:
          image:
            tags: [video83]

      ## Begin PHP 8.5 stages
      # Plain Shellbox with just PHP for RPC (PHP 8.5)
      - name: php-rpc85
        build: prod85
        publish:
          image:
            tags: [php-rpc85]
      # Shellbox with media handling packages (PHP 8.5)
      - name: media85
        build: media85
        publish:
          image:
            tags: [media85]
      # Shellbox with Score packages (PHP 8.5)
      - name: score85
        build: score85
        publish:
          image:
            tags: [score85]
      # Shellbox with SyntaxHighlight packages (PHP 8.5)
      - name: syntaxhighlight85
        build: syntaxhighlight85
        publish:
          image:
            tags: [syntaxhighlight85]
      # Shellbox with Timeline packages (PHP 8.5)
      - name: timeline85
        build: timeline85
        publish:
          image:
            tags: [timeline85]
      # Shellbox with audio+video handling packages (PHP 8.5)
      - name: video85
        build: video85
        publish:
          image:
            tags: [video85]
